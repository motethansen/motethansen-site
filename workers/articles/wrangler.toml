name = "motethansen-articles"
main = "src/index.js"
compatibility_date = "2024-09-23"
# Reached only through service bindings from motethansen.com (and vizneo.com): no public workers.dev URL.
workers_dev = false

[[d1_databases]]
migrations_dir = "migrations"
binding = "DB"
database_name = "motethansen-articles"
database_id = "91461182-5c81-43f5-9871-e6111c1a3e9a"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "motethansen-media"

# Same KV namespace the site uses: holds the sign-in throttle counters.
[[kv_namespaces]]
binding = "SITE_KV"
id = "1b97cac1e10d4bcaaa1bef301a86af26"

# The editor page (admin-ui/admin/*) is served by this Worker so motethansen.com and vizneo.com share one copy.
[assets]
directory = "./admin-ui"
binding = "ASSETS"
run_worker_first = true
